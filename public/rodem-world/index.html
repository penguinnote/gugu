<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>로뎀 월드 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 한 화면 3인칭 게임 — 끝이 있는 푸른 초원, 가운데 로뎀나무와 교회, 둘레에 열두 목장 마을. 아바타를 손가락 따라 걷기·방향키·땅 누르기로 걷게 한다. 크림색 패널이 아래에서 떠오른다. 밝은 낮 한 가지 모습으로만 간다. */
:root {
  color-scheme: light;
  --sky-top: #8fcdee;
  --sky-low: #e4f3ea;
  --meadow-deep: #4f9e3e;
  --wood: #b9794a;
  --cream: #fffaf0;
  --glass: rgba(255, 250, 240, .9);
  --ink: #2f3b29;
  --ink-soft: #6a7860;
  --line: #eadfc8;
  --berry: #7b5cc4;
  --berry-deep: #5c4399;
  --alert: #8e3b33;
  --display: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
html, body { height: 100%; }
body { background: #dcefd2; color: var(--ink); font-family: var(--body); padding-inline: 16px; padding-block: 12px; box-sizing: border-box; }
* { box-sizing: border-box; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--berry); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  position: relative; height: 100%; max-width: 460px; margin: 0 auto; overflow: hidden; border-radius: 30px;
  background: linear-gradient(180deg, var(--sky-top) 0%, #bfe3f3 38%, var(--sky-low) 62%, #cfe8c4 100%);
  box-shadow: 0 18px 50px rgba(47, 59, 41, .22); user-select: none; -webkit-user-select: none;
}
canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#gl.dragging { cursor: grabbing; }

.labels, .slots { position: absolute; inset: 0; pointer-events: none; }
.tag {
  position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--display); font-size: 13px; color: #fff;
  padding: 4px 10px 5px; border-radius: 10px; background: #b07445; box-shadow: 0 2px 0 #7f4d2a;
}
.tag::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 1px; }
.tag.mine { background: var(--berry); box-shadow: 0 2px 0 var(--berry-deep); }
.tag.plain { background: var(--cream); color: var(--ink); box-shadow: 0 2px 0 var(--line); }
.tag.me { background: #fff; color: var(--berry-deep); font-size: 12px; padding: 2px 8px 3px; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
.tag[hidden] { display: none; }
.slot-btn {
  position: absolute; left: 0; top: 0; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%;
  border: 2.5px dashed #fff; background: rgba(255, 255, 255, .55); pointer-events: auto; cursor: pointer;
  font-family: var(--display); font-size: 18px; color: var(--ink); box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
}
.slot-btn.filled { border-style: solid; background: rgba(255, 255, 255, .8); font-size: 15px; }
/* 집 안 자리(2026-11-10) — 빈 자리마다 반투명 +, 꾸미는 중엔 놓인 자리에 작은 연필, 고른 자리는 라임 테 */
.slot-btn.room { width: 36px; height: 36px; margin: -18px 0 0 -18px; border: 2px dashed rgba(255, 255, 255, .95); background: rgba(255, 255, 255, .32); color: #fff; font-size: 22px; line-height: 1; text-shadow: 0 1px 4px rgba(0, 0, 0, .35); box-shadow: none; transition: transform .15s; }
.slot-btn.room.filled { width: 28px; height: 28px; margin: -14px 0 0 -14px; border: 2px solid #fff; background: rgba(255, 255, 255, .7); color: var(--ink); font-size: 13px; text-shadow: none; }
.slot-btn.room.sel { border: 3px solid #9bd12e; background: rgba(155, 209, 46, .35); transform: scale(1.18); }
.slot-btn.room.filled.sel { background: #fff; }
/* 집 안에서 '집 꾸미기' — 아래 가운데 알약 */
.decor-btn { position: absolute; z-index: 6; left: 50%; bottom: calc(14px + var(--safe-b, 0px)); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; cursor: pointer; font-family: var(--display); font-size: 15px; color: var(--gg-ink, #1b2533); background: rgba(255, 255, 255, .96); border: 2px solid var(--gg-line, #e1e9f2); box-shadow: 0 3px 0 var(--gg-lip, #d0dbe8); }
.decor-btn svg { width: 20px; height: 20px; }
.decor-btn:active { transform: translateX(-50%) translateY(2px); box-shadow: 0 1px 0 var(--gg-lip, #d0dbe8); }
/* 꾸미는 중(집 · 마당, 2026-11-10) — 가로 화면에서 창을 위 끝까지 · 폭은 좁게(방 · 마당이 크게 보이게), 메뉴 단추 · 레일은 숨긴다 */
@media (orientation: landscape) and (max-height: 560px) {
  .app.decor .menu-btn, .app.decor .tabs { display: none; }
  .app.decor .panel { left: calc(8px + var(--safe-l)); top: calc(8px + var(--safe-t)); width: min(330px, 38vw); }
  /* 꾸미기(생김새 · 소품, 2026-11-10) — 집 · 마당 꾸미기처럼 창을 위 끝까지(위쪽 '홈으로' 알약은 창이 열리면 숨는다). 메뉴 줄은 그대로 */
  .app.dressing .panel { top: calc(8px + var(--safe-t)); }
}
/* 꾸미기 창 — 자리 이름(‹ ›) · 가구 칸 · 아래 고정 단추 줄 */
.dslot { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
.dslot b { flex: 1; text-align: center; font-family: var(--display); font-weight: 400; font-size: 16px; }
.dslot button { width: 36px; height: 36px; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 2px 0 var(--line); font-family: var(--display); font-size: 18px; cursor: pointer; color: var(--ink); }
.dbar { position: sticky; bottom: 0; z-index: 2; display: flex; gap: 8px; margin-top: 12px; padding: 10px 0 2px; background: linear-gradient(transparent, #fff 30%); }
.dbar .btn { padding: 11px 12px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.ph-r { display: flex; align-items: center; gap: 6px; }
.done-pill { border: 0; border-radius: 999px; padding: 8px 12px; background: #9bd12e; color: #1f2a05; font-family: var(--display); font-size: 14px; cursor: pointer; box-shadow: 0 3px 0 #7fb11c; white-space: nowrap; }
.done-pill:active { transform: translateY(2px); box-shadow: 0 1px 0 #7fb11c; }
/* 꾸미기 창 머리(제목 · 열매 · 나가기 · 자리 ‹ ›) — 가구 칸을 스크롤해도 위에 그대로(2026-11-10 사용자 요청) */
.dhead { position: sticky; top: -8px; z-index: 3; display: grid; gap: 12px; margin: -8px -18px 0; padding: 8px 18px 2px; background: rgba(255, 255, 255, .97); }
.dhead .dslot { margin-bottom: 4px; }
.wear.here { outline: 3px solid #9bd12e; outline-offset: 1px; }
.wear .here-tag { font-size: 11px; font-weight: 700; color: #4a6b0e; }

.hud { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 5; }
.hud > * { pointer-events: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px;
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 3px 0 rgba(47, 59, 41, .12);
  font-family: var(--display); font-size: 15px;
}
.chip small { font-family: var(--body); font-size: 12px; color: var(--ink-soft); }
.chip select { border: 0; background: transparent; font-family: var(--display); font-size: 14px; }
.title-chip { flex-direction: column; align-items: flex-start; gap: 0; border-radius: 18px; padding: 8px 14px; }
.title-chip b { font-weight: 400; font-size: 18px; line-height: 1.1; }
.berries { font-variant-numeric: tabular-nums; }
.minimap { width: 96px; height: 96px; border-radius: 50%; background: var(--glass); box-shadow: 0 3px 0 rgba(47, 59, 41, .12); display: block; cursor: pointer; }
.hud-top { display: flex; align-items: center; gap: 6px; }
/* 큰 지도 — 미니맵을 누르면 가운데에(2026-11-10) */
.bigmap { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(27, 37, 51, .45);
  padding: calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l)); }
.bigmap-card { position: relative; padding: 10px; border-radius: 26px; background: #fff; border: 2px solid var(--gg-line, #e1e9f2); box-shadow: 0 4px 0 var(--gg-lip, #d0dbe8), 0 18px 40px rgba(27, 37, 51, .25); }
.bigmap canvas { display: block; }
.bigmap-x { position: absolute; top: 8px; right: 8px; z-index: 1; width: 36px; height: 36px; border-radius: 12px; border: 2px solid var(--gg-line, #e1e9f2); background: #fff; box-shadow: 0 2px 0 var(--gg-lip, #d0dbe8); font-size: 15px; color: var(--ink); cursor: pointer; }
.menu-slot { display: none; width: 40px; height: 36px; flex: none; }

.status {
  position: absolute; left: 50%; top: 86px; transform: translateX(-50%); z-index: 4; max-width: calc(100% - 140px); margin: 0;
  text-align: center; font-size: 13px; line-height: 1.45; padding: 8px 14px; border-radius: 14px;
  background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 3px 0 rgba(47, 59, 41, .1);
}
.status b { font-family: var(--display); font-weight: 400; font-size: 15px; display: block; }

.stick { position: absolute; left: 22px; bottom: 104px; width: 116px; height: 116px; border-radius: 50%; z-index: 6; touch-action: none;
  background: rgba(255, 250, 240, .45); border: 2px solid rgba(255, 255, 255, .8); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
  background: var(--cream); box-shadow: 0 4px 0 rgba(47, 59, 41, .18); transition: transform .12s; }
.stick.on .knob { transition: none; }
/* 동작 단추 — 오른손 엄지 자리. 점프(크게) · 하이파이브 · 앉기(누르면 앉고 다시 누르면 일어남). 달리기는 조이스틱을 멀리 끌면 */
[hidden] { display: none !important; } /* 숨긴 창이 투명하게 화면을 덮지 않게 */
.pad { position: absolute; right: 16px; bottom: 100px; width: 156px; height: 156px; z-index: 6; pointer-events: none; }
.pbtn { position: absolute; pointer-events: auto; border: 0; border-radius: 50%; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
  display: grid; place-items: center; align-content: center; gap: 1px; padding: 0; background: var(--cream); color: var(--ink);
  font-family: var(--display); font-size: 11px; box-shadow: 0 4px 0 var(--line), 0 10px 22px rgba(47, 59, 41, .16); transition: transform .08s, box-shadow .08s; }
.pbtn svg { width: 24px; height: 24px; }
.pbtn.jump { right: 0; bottom: 0; width: 76px; height: 76px; font-size: 12px; background: var(--berry); color: #fff; box-shadow: 0 5px 0 var(--berry-deep), 0 12px 26px rgba(92, 67, 153, .3); }
.pbtn.jump svg { width: 30px; height: 30px; }
.pbtn.five { right: 88px; bottom: 6px; width: 60px; height: 60px; }
.pbtn.sit { right: 8px; bottom: 90px; width: 60px; height: 60px; }
.pbtn.run { right: 78px; bottom: 78px; width: 60px; height: 60px; }
.pbtn:active, .pbtn.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--line), 0 6px 14px rgba(47, 59, 41, .14); }
.pbtn.jump:active, .pbtn.jump.down { box-shadow: 0 2px 0 var(--berry-deep), 0 8px 18px rgba(92, 67, 153, .26); }
.pbtn[aria-pressed="true"] { background: var(--mint, #d6f2d2); }
.act {
  position: absolute; right: 20px; bottom: 268px; z-index: 6; border: 0; cursor: pointer; min-width: 112px;
  padding: 14px 18px; border-radius: 22px; background: var(--berry); color: #fff; font-family: var(--display); font-size: 16px;
  box-shadow: 0 5px 0 var(--berry-deep), 0 12px 26px rgba(92, 67, 153, .3);
}
.fade { position: absolute; inset: 0; z-index: 30; background: #fffaf0; opacity: 0; pointer-events: none; transition: opacity .28s ease; }
.fade.on { opacity: 1; pointer-events: auto; }
.act.calm { background: var(--cream); color: var(--ink); box-shadow: 0 5px 0 var(--line), 0 12px 26px rgba(47, 59, 41, .15); }
.act[disabled] { cursor: default; opacity: .9; }

.tabs {
  position: absolute; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); z-index: 12;
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 22px;
  background: rgba(255, 250, 240, .95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 0 rgba(47, 59, 41, .1), 0 12px 30px rgba(47, 59, 41, .16);
}
.tab { border: 0; background: transparent; cursor: pointer; padding: 6px 0 5px; border-radius: 16px; display: grid; justify-items: center; gap: 1px; font-size: 12px; color: var(--ink-soft); }
.tab svg { width: 26px; height: 26px; }
/* 가로 화면 메뉴 단추 — 세로 화면에서는 탭이 늘 아래에 있어 숨긴다 */
.menu-btn { display: none; position: absolute; z-index: 12; width: 48px; height: 48px; place-items: center; border: 0; border-radius: 16px; cursor: pointer; color: var(--ink);
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 3px 0 rgba(47, 59, 41, .12); }
.menu-btn svg { width: 22px; height: 22px; }
.menu-btn[aria-expanded="true"] { background: #eaf6df; }
.tab[aria-current="page"] { background: #eaf6df; color: var(--ink); font-family: var(--display); font-size: 13px; }

.panel {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; height: 0; overflow: hidden;
  background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius: 26px 26px 0 0; box-shadow: 0 -8px 30px rgba(47, 59, 41, .14); transition: height .45s cubic-bezier(.2, .8, .2, 1);
}
.panel-inner { height: 100%; overflow-y: auto; padding: 8px 18px 110px; display: grid; gap: 12px; align-content: start; }
.grabber { width: 42px; height: 5px; border-radius: 3px; background: #d9ccb0; margin: 4px auto 2px; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ph h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; text-wrap: balance; }
.ph p { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }
.label { font-family: var(--display); font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; }
.label small { font-family: var(--body); font-size: 12px; color: var(--ink-soft); }
.collect { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { background: #fff; border-radius: 16px; padding: 8px 4px 6px; text-align: center; box-shadow: 0 2px 0 var(--line); }
.tile svg { width: 100%; height: 38px; }
.tile span { display: block; font-size: 12px; margin-top: 2px; }
.tile.away { background: #f3efe5; box-shadow: none; }
.tile.away span { color: var(--ink-soft); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; cursor: pointer; padding: 12px 16px; border-radius: 16px; font-family: var(--display); font-size: 16px; flex: 1; min-width: 0; }
.btn.primary { background: var(--meadow-deep); color: #fff; box-shadow: 0 4px 0 #3a7a2e; }
.btn.ghost { background: #fff; box-shadow: 0 4px 0 var(--line); }
.btn[disabled] { opacity: .55; cursor: default; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.fchip[aria-pressed="true"] { border-color: var(--meadow-deep); background: #eaf6df; }
.fchip[disabled] { opacity: .5; cursor: default; }
.note { font-size: 13px; line-height: 1.55; color: var(--ink-soft); background: #fff; border-radius: 14px; padding: 10px 12px; margin: 0; }
.note b { color: var(--ink); font-weight: 400; font-family: var(--display); }
.cats { display: flex; gap: 6px; overflow-x: auto; }
.cat { border: 0; cursor: pointer; padding: 8px 14px; border-radius: 999px; background: #fff; font-family: var(--display); font-size: 15px; white-space: nowrap; box-shadow: 0 2px 0 var(--line); }
.cat[aria-pressed="true"] { background: var(--wood); color: #fff; box-shadow: 0 2px 0 #8d5530; }
/* 꾸미기 — 고르는 줄마다 이름표 + 칩 또는 색 동그라미 */
.dress { display: grid; gap: 14px; padding-bottom: 16px; }
.drow { display: grid; gap: 7px; }
.drow h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 15px; color: var(--ink); }
.drow .cats { flex-wrap: wrap; overflow: visible; }
.drow .cat { font-size: 14px; padding: 7px 12px; }
.sws { display: flex; gap: 9px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; box-shadow: 0 2px 0 var(--line), 0 0 0 1px rgba(47, 59, 41, .12); padding: 0; }
.sw[aria-pressed="true"] { outline: 3px solid var(--wood); outline-offset: 2px; }
.wears { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
.wear { border: 0; background: #fff; border-radius: 16px; padding: 6px 4px 8px; display: grid; justify-items: center; align-content: start; gap: 2px; font: inherit; font-size: 12px; color: var(--ink); cursor: pointer; box-shadow: 0 2px 0 var(--line); }
.wear .thumb { aspect-ratio: 1; border-radius: 12px; }
.wear .wnone { width: 100%; aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; background: #f3efe6; font-family: var(--display); font-size: 14px; color: var(--ink-soft); }
.wear small { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: var(--ink-soft); }
.wear.lock .thumb { opacity: .45; filter: grayscale(.4); }
.wear[aria-pressed="true"] { outline: 3px solid var(--wood); outline-offset: 1px; }
.wear.trying { outline: 3px dashed var(--wood); outline-offset: 1px; }
.wear.trying .thumb { opacity: 1; filter: none; }
/* 입어 보기(2026-10-25) — 안 산 소품을 누르면 아바타에 바로 입혀 보여 준다. 사기 전까지는 저장하지 않는다 */
.trybar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 10px 12px; border-radius: 16px; background: #fff7e6; box-shadow: 0 2px 0 var(--line); font-size: 13px; color: var(--ink); }
.trybar b { flex: 1; min-width: 0; font-family: var(--display); font-weight: 400; font-size: 15px; }
.trybar button { border: 0; border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.trybar .tbuy { background: #9bd12e; color: #1f2a05; }
.trybar .toff { background: #f3efe6; color: var(--ink-soft); }
.card .tryon { border: 0; border-radius: 999px; padding: 4px 10px; margin: 2px 0; background: #f3efe6; color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.locked { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.locked div { border-radius: 16px; background: #fff; padding: 10px 6px; text-align: center; font-size: 13px; color: var(--ink-soft); box-shadow: 0 2px 0 var(--line); }
.locked b { display: block; font-family: var(--display); font-weight: 400; font-size: 14px; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { background: #fff; border-radius: 20px; padding: 8px 8px 12px; display: grid; gap: 4px; justify-items: center; text-align: center; box-shadow: 0 3px 0 var(--line); }
.thumb { width: 100%; aspect-ratio: 1 / .8; max-width: 100%; border-radius: 14px; background: radial-gradient(circle at 50% 70%, #d9f0c8, #eef8e6 70%); display: grid; place-items: center; overflow: hidden; }

/* ── 휴대폰 비율(월드 2) — 화면을 꽉 채우고, 조작 단추·탭은 작게. 엄지가 닿는 아래 두 귀퉁이만 쓴다 ── */

/* 가로 화면 — 탭은 왼쪽 세로 줄, 동작 단추는 오른쪽 아래. 패널은 탭 바로 옆(왼쪽)에서 밀려 나온다 — 누른 탭과 열린 창이 한자리에 */
@media (orientation: landscape) and (max-height: 560px) {
  :root { --rail: 62px; }
  /* 탭 줄은 접혀 있다 — 맨 왼쪽 위 '홈으로' 바로 밑 메뉴 단추로 펼친다(2026-10-12). 펼치면 그 아래로 세로 줄 */
  /* 메뉴 단추는 오른쪽 위 줄의 설정 왼쪽(2026-11-10 — 열매 · 메뉴 · 설정). 누르면 열매가 왼쪽으로 밀려나고 그 자리에 탭 넷이 가로로 펼쳐진다
   * (2026-11-11 사용자 요청 — 빈 자리 menu-slot 이 탭 줄 폭만큼 넓어진다). 탭 줄 폭 = 칸 52 × 4 + 사이 2 × 3 + 안쪽 3 × 2 = 220 */
  :root { --tabs-w: 220px; }

  .panel[data-open="true"] { transform: none; }
  .panel-inner { padding-bottom: 20px; }
}

    const PLAY_SET = [["play_swing_A_large", { s: .75, x: -2.8, z: -2.2 }], ["play_slide_A", { s: .7, x: 3, z: -1.8, ry: -.6 }], ["play_seesaw_large", { s: .8, x: -.6, z: 2.6, ry: Math.PI / 2 }], ["play_spring_horse_A", { s: .8, x: -3.6, z: 3.2, ry: .5 }], ["play_sandbox_round_decorated", { s: .65, x: 3.2, z: 3.4 }]];

    { const L = []; let flip = 1;

  // 길 — Quaternius Medieval Village MegaKit(Standard, CC0)의 '흙에 돌 박힌 바닥' 무늬만 쓴다(집은 Tiny Treats 로). 출처는 village/CREDITS.txt
  function applyPaths() {
    // 길 — 마을끼리 잇는 굽은 길을 따라 띠를 깔고 키트 바닥 무늬를 2.4m마다 되풀이. 밑에 조금 넓고 어두운 띠로 가장자리를 부드럽게. 분수 광장엔 둥근 돌바닥
    new T.TextureLoader().load("village/T_UnevenBrick_BaseColor.jpg", (tx) => {
      tx.wrapS = tx.wrapT = T.RepeatWrapping; tx.colorSpace = T.SRGBColorSpace; tx.anisotropy = 8;
      // 깊이는 쓰지 않는다(depthWrite false) — 풀밭 위에 얹힌 무늬라, 쓰면 길에 앉은 다리 · 발끝이 길 '밑'으로 잡혀 가려진 모습이 비친다
      // 길 띠는 위를 보는 바닥 — 양면으로 그리되 아래를 보는 면(급히 꺾여 접힌 곳)도 법선을 뒤집지 않고 늘 위로 비춘다(2026-10-15, 갈라진 듯 어두운 금 없애기)

          const p = pts[i], a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; let tx2 = b.x - a.x, tz2 = b.z - a.z; const tl = Math.hypot(tx2, tz2) || 1; tx2 /= tl; tz2 /= tl;

      };

  avatar.x = SEAT0.x; avatar.z = SEAT0.z; avatar.y = groundY(avatar.x, avatar.z); avatar.face = restAz(); Object.assign(cam, { tx: avatar.x, ty: avatar.y + 1.2, tz: avatar.z, dist: 6, pol: .05, az: restAz() + .3 });
